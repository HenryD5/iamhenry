<style>
/* Layout: cabecera breve, selector de escenarios, diagrama SVG a la izquierda y panel de pasos a la derecha; detalle de componente debajo. */
:root{
  --bg:#f4f6f2; --surface:#ffffff; --ink:#18231d; --muted:#5d6b62; --line:#c9d2c9;
  --zone:#e8ede6; --zone2:#eef1ea; --accent:#1d6f52; --accent-soft:#d6ebe0;
  --packet:#c9751a; --packet-soft:#f7e3c8; --ext:#6a4fa3; --ext-soft:#ebe4f6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#18211b; --ink:#e3ebe4; --muted:#93a398; --line:#33423a;
  --zone:#1a241e; --zone2:#1d2822; --accent:#5cc49a; --accent-soft:#1f3a2e;
  --packet:#f0a64a; --packet-soft:#3d2c16; --ext:#b39ce6; --ext-soft:#2b2440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#18211b; --ink:#e3ebe4; --muted:#93a398; --line:#33423a;
  --zone:#1a241e; --zone2:#1d2822; --accent:#5cc49a; --accent-soft:#1f3a2e;
  --packet:#f0a64a; --packet-soft:#3d2c16; --ext:#b39ce6; --ext-soft:#2b2440; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px;max-width:72ch}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:500 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tab:focus-visible,.btn:focus-visible,.step:focus-visible{outline:2px solid var(--packet);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;min-width:0}
.diagram svg{display:block;width:100%;min-width:760px;height:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;line-height:1.2}
.panel .lead{margin:0;color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:500 13px var(--body);background:var(--zone);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--packet);border-color:var(--packet);color:var(--bg)}
.counter{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:520px;overflow-y:auto}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.step:hover{background:var(--zone2)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.step .t{font-weight:600;font-size:14px}
.step .d{font-size:13px;color:var(--muted);display:none}
.step .f{font-family:var(--mono);font-size:11.5px;color:var(--accent);display:none;word-break:break-all}
.step.on{background:var(--packet-soft);border-color:var(--packet)}
.step.on .n{color:var(--packet)}
.step.on .d,.step.on .f{display:block}
.step.done .n{color:var(--accent)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
@media (max-width:700px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail h3{font-family:var(--display);font-size:18px;margin:0 0 4px}
.detail .tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.detail ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.detail code,.step code{font-family:var(--mono);font-size:.9em}
.hint{font-size:13px;color:var(--muted);margin:0}
/* SVG */
svg text{font-family:var(--body);fill:var(--ink)}
.zone{fill:var(--zone);stroke:var(--line)}
.zone.b{fill:var(--zone2)}
.zone.ext{fill:var(--ext-soft);stroke:var(--ext);stroke-dasharray:4 4}
.zlabel{font-family:var(--mono);font-size:11px;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.node{cursor:pointer}
.node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .2s,fill .2s}
.node .nt{font-weight:600;font-size:14px}
.node .ns{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.node:hover rect{stroke:var(--accent)}
.node.sel rect{stroke:var(--accent);stroke-width:2.5}
.node.on rect{stroke:var(--packet);stroke-width:2.5;fill:var(--packet-soft)}
.node.ext rect{stroke:var(--ext)}
.node.ext.on rect{stroke:var(--packet)}
.node:focus-visible rect{stroke:var(--packet);stroke-width:3}
.container{fill:none;stroke:var(--accent);stroke-dasharray:5 4;stroke-width:1.2}
.clabel{font-family:var(--mono);font-size:10.5px;fill:var(--accent)}
.edge{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .2s}
.edge.on{stroke:var(--packet);stroke-width:3}
.elabel{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.pk circle{fill:var(--packet);stroke:var(--surface);stroke-width:2}
.pk rect{fill:var(--ink)}
.pk text{fill:var(--bg);font-family:var(--mono);font-size:11px}
.pulse{fill:none;stroke:var(--packet);stroke-width:2;opacity:0}
.pulse.go{animation:pulse 1.1s ease-out 2}
@keyframes pulse{from{opacity:.9;stroke-width:6}to{opacity:0;stroke-width:1}}
@media (prefers-reduced-motion:reduce){.pulse.go{animation:none}}
</style>

<div class="wrap">

const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// draw edges
const eG=$('edges'),paths={};
for(const [id,e] of Object.entries(EDGES)){
  const p=el('path',{d:e.d,class:'edge'+(e.hidden?'':''),id:'e-'+id},eG);
  if(e.hidden)p.style.opacity='0';
  paths[id]=p;
  if(e.l)el('text',{x:e.lx,y:e.ly,class:'elabel'},eG).textContent=e.l;
}
// draw nodes
const nG=$('nodes'),nodeEls={},pulses={};
for(const [id,n] of Object.entries(NODES)){
  const g=el('g',{class:'node'+(n.ext?' ext':''),tabindex:'0',role:'button','aria-label':n.t},nG);
  el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:8},g);
  const cx=n.x+n.w/2;
  el('text',{x:cx,y:n.y+n.h/2-3,'text-anchor':'middle',class:'nt'},g).textContent=n.t;
  el('text',{x:cx,y:n.y+n.h/2+15,'text-anchor':'middle',class:'ns'},g).textContent=n.s;
  g.addEventListener('click',()=>showNode(id));
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();showNode(id)}});
  nodeEls[id]=g;
  pulses[id]=el('rect',{x:n.x-3,y:n.y-3,width:n.w+6,height:n.h+6,rx:10,class:'pulse'},$('pulses'));
}

function showNode(id){
  const n=NODES[id];
  for(const k in nodeEls)nodeEls[k].classList.toggle('sel',k===id);
  $('detail').innerHTML=`<div><h3>${n.t}</h3><div class="tag">${n.tag}</div></div><ul>${n.li.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}

// tabs
let sc=SC[0],idx=-1,playing=false,timer=null,anim=null;
SC.forEach(s=>{
  const b=document.createElement('button');b.className='tab';b.type='button';b.textContent=s.t;b.dataset.id=s.id;
  b.addEventListener('click',()=>select(s.id,true));$('tabs').appendChild(b);
});

function select(id,auto){
  stop();sc=SC.find(s=>s.id===id);idx=-1;
  try{localStorage.setItem('pf-sc',id)}catch(e){}
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));
  $('sTitle').textContent=sc.t;$('sLead').textContent=sc.lead;
  const ol=$('steps');ol.innerHTML='';
  sc.steps.forEach((s,i)=>{
    const li=document.createElement('li');li.className='step';li.tabIndex=0;
    li.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><div><div class="t">${s.t}</div><div class="d">${s.d}</div>${s.f?`<div class="f">${s.f}</div>`:''}</div>`;
    li.addEventListener('click',()=>{stop();go(i)});
    li.addEventListener('keydown',ev=>{if(ev.key==='Enter'){stop();go(i)}});
    ol.appendChild(li);
  });
  clearHighlight();$('pk').style.display='none';updateCounter();
  if(auto)play();else go(0,true);
}

function clearHighlight(){
  Object.values(paths).forEach(p=>p.classList.remove('on'));
  Object.values(nodeEls).forEach(g=>g.classList.remove('on'));
}
function updateCounter(){$('counter').textContent=`${Math.max(idx+1,0)} / ${sc.steps.length}`}

function go(i,still){
  if(i<0||i>=sc.steps.length)return;
  idx=i;const s=sc.steps[i];
  [...$('steps').children].forEach((li,j)=>{li.classList.toggle('on',j===i);li.classList.toggle('done',j<i)});
  // scroll only the step list: scrollIntoView would also scroll the page that embeds this file
  const ol=$('steps'),cur=ol.children[i];
  if(cur){const top=cur.offsetTop-ol.offsetTop;if(top<ol.scrollTop||top+cur.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTo({top:top-8,behavior:reduce?'auto':'smooth'})}
  clearHighlight();
  s.n.forEach(n=>{nodeEls[n].classList.add('on')});
  s.p.forEach(([e])=>{paths[e].classList.add('on');if(EDGES[e].hidden)paths[e].style.opacity='1'});
  Object.entries(EDGES).forEach(([k,e])=>{if(e.hidden&&!s.p.some(([x])=>x===k))paths[k].style.opacity='0'});
  showNode(s.n[s.n.length-1]);
  updateCounter();
  if(!s.p.length){
    $('pk').style.display='none';
    s.n.forEach(n=>{const p=pulses[n];p.classList.remove('go');p.getBoundingClientRect();p.classList.add('go')});
    return Promise.resolve();
  }
  return runPacket(s.p,s.l,still);
}

function runPacket(segs,label,still){
  cancelAnimationFrame(anim);
  const pk=$('pk');pk.style.display='';
  const txt=pk.querySelector('text'),box=pk.querySelector('rect');
  txt.textContent=label||'';box.style.display=label?'':'none';
  const w=label?txt.getComputedTextLength()+14:0;box.setAttribute('width',w);
  const put=(seg,t)=>{
    const p=paths[seg[0]],L=p.getTotalLength();
    const pt=p.getPointAtLength((seg[1]?1-t:t)*L);
    // keep the label inside the drawing
    const off=pt.x+10+w>995?-(w+20):0;
    box.setAttribute('x',10+off);txt.setAttribute('x',17+off);
    pk.setAttribute('transform',`translate(${pt.x},${pt.y})`);
  };
  if(reduce||still){put(segs[segs.length-1],1);return Promise.resolve()}
  return new Promise(res=>{
    let k=0,start=null;
    const per=segs.length>3?650:900;
    const tick=ts=>{
      if(start===null)start=ts;
      let t=Math.min((ts-start)/per,1);
      const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      put(segs[k],e);
      if(t>=1){k++;start=null;if(k>=segs.length){res();return}}
      anim=requestAnimationFrame(tick);
    };
    anim=requestAnimationFrame(tick);
  });
}

async function play(){
  if(playing)return;playing=true;$('play').textContent='Pausa';
  if(idx>=sc.steps.length-1)idx=-1;
  const token=Symbol();play.token=token;
  while(playing&&play.token===token&&idx<sc.steps.length-1){
    await go(idx+1);
    if(!playing||play.token!==token)break;
    await new Promise(r=>timer=setTimeout(r,1500));
  }
  if(play.token===token)stop();
}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='Reproducir'}
$('play').addEventListener('click',()=>playing?stop():play());
$('next').addEventListener('click',()=>{stop();go(Math.min(idx+1,sc.steps.length-1))});
$('prev').addEventListener('click',()=>{stop();go(Math.max(idx-1,0))});
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('.node'))return;
  if(ev.key==='ArrowRight'){stop();go(Math.min(idx+1,sc.steps.length-1))}
  if(ev.key==='ArrowLeft'){stop();go(Math.max(idx-1,0))}
});

let start='reporte';try{const v=localStorage.getItem('pf-sc');if(v&&SC.some(s=>s.id===v))start=v}catch(e){}
select(start,false);
</script>
