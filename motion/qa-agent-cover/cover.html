<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Manrope";src:url("assets/manrope.woff2") format("woff2");font-weight:200 800}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:#F6F5FB;font-family:Inter}

.row b{height:14px;border-radius:7px;background:#CFCDE0}

.chip{display:inline-block;vertical-align:middle;background:#E5484D;color:#fff;font:600 22px Inter;border-radius:20px;padding:6px 18px;margin-top:0}
.mono{vertical-align:middle;font:500 28px "JetBrains Mono";color:#B3282D;margin-left:10px}

.ring{border-radius:50%;border:3px solid rgba(31,75,255,.16)}
.step{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 52px Manrope;color:#fff;background:#1F4BFF}
