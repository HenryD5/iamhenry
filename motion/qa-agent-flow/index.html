<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=900" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; src: url("assets/manrope.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Inter"; src: url("assets/inter-500.ttf") format("truetype"); font-weight: 500; }
      @font-face { font-family: "Inter"; src: url("assets/inter-600.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/jbmono-500.ttf") format("truetype"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 900px; overflow: hidden; background: #F6F5FB; }
      #root { position: relative; width: 100%; height: 100%; background: #F6F5FB; overflow: hidden; }
      svg { position: absolute; inset: 0; display: block; }
      .h { font-family: "Manrope", sans-serif; font-weight: 800; }
      .t { font-family: "Inter", sans-serif; font-weight: 600; }
      .p { font-family: "Inter", sans-serif; font-weight: 500; }
      .m { font-family: "JetBrains Mono", monospace; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="qa-agent-flow" data-start="0" data-width="1200" data-height="900" data-duration="10">
      <svg id="art" width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="core-grad" cx="35%" cy="30%" r="85%">
            <stop offset="0" stop-color="#96B6FE" />
            <stop offset="0.35" stop-color="#1F4BFF" />
            <stop offset="0.75" stop-color="#3B3FD6" />
            <stop offset="1" stop-color="#E11D2E" />
          </radialGradient>
          <g id="ico-ok"><circle r="20" fill="#7FB800" /><path d="M-9 0 L-3 7 L9 -7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g>
          <g id="ico-no"><circle r="20" fill="#E5484D" /><path d="M-8 -8 L8 8 M8 -8 L-8 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" /></g>
        </defs>

        <!-- barra de fases -->
        <line x1="165" y1="110" x2="1035" y2="110" stroke="#E2E0EE" stroke-width="6" stroke-linecap="round" />
        <line id="prog" x1="165" y1="110" x2="165" y2="110" stroke="#1F4BFF" stroke-width="6" stroke-linecap="round" />
        <g id="steps"></g>
        <g id="core">
          <circle r="62" fill="none" stroke="#1F4BFF" stroke-width="3" opacity="0.18" />
          <circle r="52" fill="none" stroke="#1F4BFF" stroke-width="3" opacity="0.38" />
          <circle r="42" fill="url(#core-grad)" />
          <text class="h" x="0" y="11" text-anchor="middle" font-size="30" fill="#FFFFFF">IA</text>
        </g>
        <g id="labels"></g>
        <g id="subs"></g>

        <!-- panel -->
        <rect x="60" y="260" width="1080" height="580" rx="28" fill="#FFFFFF" stroke="#E2E0EE" stroke-width="2" />

        <!-- escena 1 -->
        <g id="s1">
          <text class="p" x="110" y="335" font-size="28" fill="#767891">Tu cambio de código entra</text>
          <g id="dcard">
            <rect x="110" y="390" width="980" height="260" rx="22" fill="#0E1022" />
            <circle cx="152" cy="428" r="8" fill="#767891" /><circle cx="180" cy="428" r="8" fill="#767891" /><circle cx="208" cy="428" r="8" fill="#767891" />
            <text class="m" x="150" y="490" font-size="28" fill="#767891">git diff</text>
            <rect id="dh" x="124" y="520" width="952" height="92" rx="12" fill="#1F4BFF" fill-opacity="0.28" />
            <text id="dl" class="m" x="160" y="582" font-size="48" fill="#7FB800">+ next.config.ts</text>
          </g>
          <text id="dcap" class="p" x="110" y="735" font-size="30" fill="#4C4F66">El agente lo ve y se pone en marcha.</text>
        </g>

        <!-- escena 2 -->
        <g id="s2">
          <g class="tile"><g transform="translate(110 360)">
            <rect width="290" height="330" rx="20" fill="#EEF2FF" stroke="#1F4BFF" stroke-width="4" />
            <rect x="24" y="24" width="242" height="20" rx="10" fill="#96B6FE" />
            <rect x="24" y="64" width="242" height="110" rx="12" fill="#C9D8FF" />
            <rect x="24" y="194" width="150" height="14" rx="7" fill="#96B6FE" /><rect x="24" y="222" width="190" height="14" rx="7" fill="#96B6FE" />
            <text class="h" x="145" y="285" text-anchor="middle" font-size="32" fill="#0E1022">Portada</text>
            <rect x="80" y="-22" width="130" height="44" rx="22" fill="#1F4BFF" /><text class="t" x="145" y="8" text-anchor="middle" font-size="22" fill="#fff">probar</text>
          </g></g>
          <g class="tile"><g transform="translate(455 360)">
            <rect width="290" height="330" rx="20" fill="#EEF2FF" stroke="#1F4BFF" stroke-width="4" />
            <rect x="24" y="24" width="242" height="20" rx="10" fill="#96B6FE" />
            <rect x="24" y="64" width="110" height="80" rx="12" fill="#C9D8FF" /><rect x="156" y="64" width="110" height="80" rx="12" fill="#C9D8FF" />
            <rect x="24" y="164" width="110" height="80" rx="12" fill="#C9D8FF" /><rect x="156" y="164" width="110" height="80" rx="12" fill="#C9D8FF" />
            <text class="h" x="145" y="285" text-anchor="middle" font-size="32" fill="#0E1022">Blog</text>
            <rect x="80" y="-22" width="130" height="44" rx="22" fill="#1F4BFF" /><text class="t" x="145" y="8" text-anchor="middle" font-size="22" fill="#fff">probar</text>
          </g></g>
          <g class="tile"><g transform="translate(800 360)" opacity="0.55">
            <rect width="290" height="330" rx="20" fill="#F6F5FB" stroke="#B3B6C7" stroke-width="3" stroke-dasharray="10 10" />
            <rect x="24" y="24" width="242" height="20" rx="10" fill="#E2E0EE" />
            <rect x="24" y="64" width="242" height="110" rx="12" fill="#E2E0EE" />
            <rect x="24" y="194" width="150" height="14" rx="7" fill="#E2E0EE" /><rect x="24" y="222" width="190" height="14" rx="7" fill="#E2E0EE" />
            <text class="h" x="145" y="285" text-anchor="middle" font-size="32" fill="#767891">Contacto</text>
            <rect x="65" y="-22" width="160" height="44" rx="22" fill="#E2E0EE" /><text class="t" x="145" y="8" text-anchor="middle" font-size="22" fill="#4C4F66">sin tocar</text>
          </g></g>
        </g>

        <!-- escena 3 -->
        <g id="s3"></g>

        <!-- escena 4 -->
        <g id="s4">
          <g class="dev"><g transform="translate(110 330)">
            <rect width="640" height="430" rx="18" fill="#FFFFFF" stroke="#4C4F66" stroke-width="4" />
            <path d="M2 60 V20 A16 16 0 0 1 18 4 H622 A16 16 0 0 1 638 20 V60 Z" fill="#E2E0EE" />
            <circle cx="32" cy="32" r="8" fill="#E5484D" /><circle cx="58" cy="32" r="8" fill="#FFB020" /><circle cx="84" cy="32" r="8" fill="#7FB800" />
            <rect x="120" y="14" width="400" height="36" rx="18" fill="#FFFFFF" /><text class="m" x="140" y="39" font-size="20" fill="#4C4F66">localhost:3000</text>
            <rect x="30" y="90" width="580" height="90" rx="12" fill="#EEF2FF" />
            <rect x="30" y="200" width="270" height="150" rx="12" fill="#C9D8FF" /><rect x="330" y="200" width="280" height="150" rx="12" fill="#C9D8FF" />
            <rect x="30" y="372" width="400" height="14" rx="7" fill="#E2E0EE" />
          </g></g>
          <g class="dev"><g transform="translate(830 330)">
            <rect width="250" height="430" rx="34" fill="#FFFFFF" stroke="#4C4F66" stroke-width="4" />
            <rect x="95" y="16" width="60" height="10" rx="5" fill="#E2E0EE" />
            <rect x="24" y="52" width="202" height="60" rx="10" fill="#EEF2FF" />
            <rect x="24" y="130" width="202" height="110" rx="10" fill="#C9D8FF" />
            <rect x="24" y="258" width="202" height="14" rx="7" fill="#E2E0EE" /><rect x="24" y="286" width="140" height="14" rx="7" fill="#E2E0EE" />
          </g></g>
          <text class="t lbl4" x="430" y="805" text-anchor="middle" font-size="26" fill="#4C4F66">Ordenador</text>
          <text class="t lbl4" x="955" y="805" text-anchor="middle" font-size="26" fill="#4C4F66">Móvil</text>
          <g id="s4-checks"></g>
        </g>

        <!-- escena 5 -->
        <g id="s5"></g>
      </svg>
    </div>

    <script>
      var NS = "http://www.w3.org/2000/svg";
      function el(parent, html) { parent.insertAdjacentHTML("beforeend", html); }
      function use(id, x, y) { return '<use href="#' + id + '" x="' + x + '" y="' + y + '"/>'; }

      var NAMES = ["Alcance", "Plan", "Prueba en Chrome", "Informe"];
      var SUBS = ["Un cambio de código entra", "El agente decide qué páginas probar", "Antes de abrir el navegador: qué debe pasar", "Abre Chrome y lo comprueba en dos tamaños", "Qué pasó, qué tan grave y qué archivo revisar"];
      var XS = [165, 455, 745, 1035];

      // nodos de fase: pendiente / hecha, y rótulos
      var steps = document.getElementById("steps");
      var labels = document.getElementById("labels");
      XS.forEach(function (x, i) {
        el(steps, '<g id="pend' + i + '"><circle cx="' + x + '" cy="110" r="26" fill="#FFFFFF" stroke="#B3B6C7" stroke-width="4"/><text class="h" x="' + x + '" y="121" text-anchor="middle" font-size="30" fill="#767891">' + (i + 1) + '</text></g>');
        el(steps, '<g id="done' + i + '"><circle cx="' + x + '" cy="110" r="26" fill="#1F4BFF"/><path d="M' + (x - 11) + ' 110 L' + (x - 3) + ' 119 L' + (x + 12) + ' 101" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>');
        el(labels, '<text id="lab' + i + '" class="h" x="' + x + '" y="196" text-anchor="middle" font-size="30" fill="#0E1022">' + NAMES[i] + '</text>');
      });

      SUBS.forEach(function (t, k) { el(document.getElementById("subs"), '<text id="sub' + k + '" class="p" x="600" y="238" text-anchor="middle" font-size="26" fill="#4C4F66">' + t + '</text>'); });

      // escena 3: plan
      var CASES = [["Enlaces del menú", "Llevan a su página"], ["Portada", "Carga sin errores"], ["Versión móvil", "Nada se sale de la pantalla"]];
      var s3 = document.getElementById("s3");
      CASES.forEach(function (c, i) {
        var y = 320 + i * 170;
        el(s3, '<g class="case" id="case' + i + '"><rect x="110" y="' + y + '" width="980" height="140" rx="20" fill="#F6F5FB"/>' +
          '<rect x="140" y="' + (y + 46) + '" width="48" height="48" rx="12" fill="#fff" stroke="#1F4BFF" stroke-width="4"/>' +
          '<text class="t" x="224" y="' + (y + 62) + '" font-size="32" fill="#0E1022">' + c[0] + '</text>' +
          '<text class="p" x="224" y="' + (y + 106) + '" font-size="26" fill="#4C4F66">Esperado: ' + c[1] + '</text></g>');
      });

      // escena 4: comprobaciones
      var s4c = document.getElementById("s4-checks");
      el(s4c, '<g id="chk-d">' + use("ico-ok", 190, 440) + '<text class="t" x="224" y="450" font-size="26" fill="#0E1022">Carga bien</text>' + use("ico-ok", 190, 560) + '<text class="t" x="224" y="570" font-size="26" fill="#0E1022">Sin errores</text>' + '</g>');
      el(s4c, '<g id="chk-m">' + use("ico-ok", 884, 520) + '<text class="t" x="918" y="530" font-size="24" fill="#0E1022">Cabe</text>' + '</g>');
      el(s4c, '<g id="chk-d2">' + use("ico-ok", 450, 440) + '<text class="t" x="484" y="450" font-size="26" fill="#0E1022">Enlaces</text>' + '</g>');

      // escena 5: informe
      var s5 = document.getElementById("s5");
      function row(y, ok, title, extra) {
        var bg = ok ? "#F6F5FB" : "#FCD9DA";
        var h = '<rect x="110" y="' + y + '" width="980" height="' + (ok ? 120 : 190) + '" rx="20" fill="' + bg + '"' + (ok ? '' : ' stroke="#E5484D" stroke-width="3"') + '/>' +
          use(ok ? "ico-ok" : "ico-no", 166, y + 60) + '<text class="t" x="214" y="' + (y + 72) + '" font-size="32" fill="#0E1022">' + title + '</text>';
        if (!ok) {
          h += '<rect x="214" y="' + (y + 110) + '" width="170" height="46" rx="23" fill="#E5484D"/><text class="t" x="299" y="' + (y + 142) + '" text-anchor="middle" font-size="24" fill="#fff">bloqueante</text>' +
            '<text class="m" x="410" y="' + (y + 142) + '" font-size="28" fill="#A82A2F">next.config.ts</text>';
        }
        return h;
      }
      el(s5, '<g id="r0">' + row(320, true, "Enlaces del menú") + '</g>');
      el(s5, '<g id="r1">' + row(465, false, "Portada: error 500") + '</g>');
      el(s5, '<g id="r2">' + row(675, true, "Versión móvil") + '</g>');

      // ---------- línea de tiempo ----------
      var tl = gsap.timeline({ paused: true });
      var E = "power4.out"; // --ease: cubic-bezier(0.22, 1, 0.36, 1)
      var T = [0, 1.8, 3.6, 5.6, 7.8];
      var SC = ["#s1", "#s2", "#s3", "#s4", "#s5"];
      var CORE_X = [165, 165, 455, 745, 1035];
      var GREY = "#767891", INK = "#0E1022";
      var i, k;

      // estado inicial = estado final (bucle)
      gsap.set(["#s2", "#s3", "#s4", "#s5"], { autoAlpha: 0 });
      gsap.set("#s1", { autoAlpha: 1 });
      gsap.set("#sub0", { autoAlpha: 1 });
      gsap.set(["#sub1", "#sub2", "#sub3", "#sub4"], { autoAlpha: 0 });
      gsap.set("#core", { x: 165, y: 110 });
      gsap.set("#prog", { attr: { x2: 165 } });
      for (i = 0; i < 4; i++) {
        gsap.set("#done" + i, { autoAlpha: 0, scale: 0.4, svgOrigin: XS[i] + " 110" });
        gsap.set("#pend" + i, { autoAlpha: 1 });
        gsap.set("#lab" + i, { fill: GREY });
      }
      gsap.set(["#chk-d", "#chk-d2", "#chk-m"], { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%" });
      gsap.set("#dh", { scaleX: 0, svgOrigin: "124 566" });
      gsap.set("#dl", { autoAlpha: 0, x: -16 });

      tl.addLabel("escena-1", 0);
      // escena 1: entra la línea del diff y se resalta
      tl.to("#dh", { scaleX: 1, duration: 0.6, ease: E }, 0.2);
      tl.to("#dl", { autoAlpha: 1, x: 0, duration: 0.5, ease: E }, 0.35);

      for (k = 1; k < 5; k++) {
        var t = T[k];
        tl.addLabel("escena-" + (k + 1), t);
        // salida de la escena anterior, entrada de la nueva
        tl.to(SC[k - 1], { autoAlpha: 0, y: -12, duration: 0.3, ease: "power2.in" }, t - 0.3);
        tl.fromTo(SC[k], { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: E }, t);
        tl.to("#sub" + (k - 1), { autoAlpha: 0, duration: 0.2 }, t - 0.3);
        tl.fromTo("#sub" + k, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: E }, t);
        // el núcleo avanza a la fase activa
        if (k >= 2) {
          tl.to("#core", { x: CORE_X[k], duration: 0.8, ease: E }, t - 0.3);
          tl.to("#prog", { attr: { x2: CORE_X[k] }, duration: 0.8, ease: E }, t - 0.3);
          tl.set("#pend" + (k - 2), { autoAlpha: 0 }, t - 0.3);
          tl.to("#done" + (k - 2), { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t + 0.3);
        }
        tl.to("#lab" + (k - 1), { fill: INK, duration: 0.3 }, t);
      }
      // detalles por escena
      tl.fromTo("#s2 .tile", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: E, stagger: 0.12 }, T[1] + 0.15);
      tl.fromTo("#s3 .case", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: E, stagger: 0.18 }, T[2] + 0.15);
      tl.fromTo("#s4 .dev", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: E, stagger: 0.12 }, T[3] + 0.15);
      tl.fromTo("#s4 .lbl4", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, T[3] + 0.4);
      ["#chk-d", "#chk-d2", "#chk-m"].forEach(function (id, j) {
        tl.to(id, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, T[3] + 0.8 + j * 0.32);
      });
      tl.fromTo(["#r0", "#r1", "#r2"], { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: E, stagger: 0.2 }, T[4] + 0.15);

      // vuelta al inicio (9,2 a 10 s): el último fotograma es el primero
      tl.addLabel("vuelta", 9.2);
      tl.to("#s5", { autoAlpha: 0, y: -12, duration: 0.3, ease: "power2.in" }, 9.2);
      tl.to("#sub4", { autoAlpha: 0, duration: 0.2 }, 9.2);
      tl.to("#core", { x: 165, duration: 0.7, ease: "power3.inOut" }, 9.3);
      tl.to("#prog", { attr: { x2: 165 }, duration: 0.7, ease: "power3.inOut" }, 9.3);
      for (i = 0; i < 4; i++) {
        tl.to("#done" + i, { autoAlpha: 0, scale: 0.4, duration: 0.3 }, 9.3);
        tl.to("#pend" + i, { autoAlpha: 1, duration: 0.3 }, 9.6);
        tl.to("#lab" + i, { fill: GREY, duration: 0.3 }, 9.5);
      }
      tl.fromTo("#s1", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: E, immediateRender: false }, 9.55);
      tl.set("#dh", { scaleX: 0 }, 9.5);
      tl.set("#dl", { autoAlpha: 0, x: -16 }, 9.5);
      tl.to("#sub0", { autoAlpha: 1, duration: 0.4, ease: E }, 9.55);
      tl.set({}, {}, 10);

      window.__timelines = window.__timelines || {};
      window.__timelines["qa-agent-flow"] = tl;
    </script>
  </body>
</html>
